<style>

const $=s=>document.querySelector(s);
const F=t=>'<div class="f">'+t+'</div>';
const M=[
['1. Metode Analitik vs Numerik',`
<p><b>Analitik</b>: memakai rumus dan teorema baku. Contoh <i>x</i><sup>2</sup> − 6<i>x</i> + 8 = 0 → difaktorkan (<i>x</i> − 4)(<i>x</i> − 2) = 0, sehingga <i>x</i><sub>1</sub> = 4 dan <i>x</i><sub>2</sub> = 2.</p>
<p><b>Numerik</b>: pendekatan aproksimasi, hanya dengan operasi aritmetika biasa. Contoh: akar <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> − 6<i>x</i> + 8 berada di selang [3, 6] karena <i>f</i> berganti tanda di selang itu (<i>f</i>(3) = −1, <i>f</i>(6) = 8).</p>
<p><b>Kelebihan numerik</b>: dapat menyelesaikan persoalan yang tidak bisa diselesaikan secara analitik.</p>
<h3>Kasus 1</h3>
<p>(a) <i>x</i><sup>2</sup> − 4<i>x</i> + 4 = 0 lebih mudah secara analitik (tinggal difaktorkan). Integral dengan integran (√(45.3e<sup>7x</sup> + 100/x))<sup>4</sup> + 4/(x<sup>2</sup>+1) sulit dicari rumus integralnya, sehingga numerik lebih logis.</p>
<p>(b) Numerik menghasilkan galat karena hanya mendekati nilai sebenarnya: ada <b>galat pemotongan</b> dan <b>galat pembulatan</b>.</p>
<p>(c) Numerik dipakai bila persamaan terlalu rumit/tak punya solusi analitik, atau saat mengolah data eksperimen (data diskrit).</p>`],
['2. Deret Taylor',`
<p>Andaikan <i>f</i> dan semua turunannya menerus di selang [<i>a</i>, <i>b</i>], <i>x</i><sub>0</sub> ∈ [<i>a</i>, <i>b</i>]. Maka untuk <i>x</i> di sekitar <i>x</i><sub>0</sub>:</p>
${F('<i>f</i>(<i>x</i>) = <i>f</i>(<i>x</i><sub>0</sub>) + (<i>x</i>−<i>x</i><sub>0</sub>)/1! · <i>f</i>′(<i>x</i><sub>0</sub>) + (<i>x</i>−<i>x</i><sub>0</sub>)<sup>2</sup>/2! · <i>f</i>″(<i>x</i><sub>0</sub>) + (<i>x</i>−<i>x</i><sub>0</sub>)<sup>3</sup>/3! · <i>f</i>‴(<i>x</i><sub>0</sub>) + … + (<i>x</i>−<i>x</i><sub>0</sub>)<sup><i>m</i></sup>/<i>m</i>! · <i>f</i><sup>(<i>m</i>)</sup>(<i>x</i><sub>0</sub>) + …')}
<p>Dengan memisalkan <i>x</i> − <i>x</i><sub>0</sub> = <i>h</i>:</p>
${F('<i>f</i>(<i>x</i>) = <i>f</i>(<i>x</i><sub>0</sub>) + <i>h</i>/1! · <i>f</i>′(<i>x</i><sub>0</sub>) + <i>h</i><sup>2</sup>/2! · <i>f</i>″(<i>x</i><sub>0</sub>) + <i>h</i><sup>3</sup>/3! · <i>f</i>‴(<i>x</i><sub>0</sub>) + … + <i>h</i><sup><i>m</i></sup>/<i>m</i>! · <i>f</i><sup>(<i>m</i>)</sup>(<i>x</i><sub>0</sub>)')}
<h3>Contoh: sin(<i>x</i>) di sekitar <i>x</i><sub>0</sub> = 1</h3>
<p><i>f</i> = sin <i>x</i>, <i>f</i>′ = cos <i>x</i>, <i>f</i>″ = −sin <i>x</i>, <i>f</i>‴ = −cos <i>x</i>, <i>f</i><sup>(4)</sup> = sin <i>x</i>, …</p>
${F('sin(<i>x</i>) = sin(1) + <i>h</i>cos(1) + <i>h</i><sup>2</sup>/2 (−sin 1) + <i>h</i><sup>3</sup>/6 (−cos 1) + <i>h</i><sup>4</sup>/24 sin(1) + …<br>= 0.8415 + 0.5403<i>h</i> − 0.4208<i>h</i><sup>2</sup> − 0.0901<i>h</i><sup>3</sup> + 0.0351<i>h</i><sup>4</sup> + …')}
<div class="note">Cara cepat: turunkan <i>f</i> berulang kali, hitung nilainya di <i>x</i><sub>0</sub>, lalu bagi dengan faktorial.</div>`],
['3. Analisis Galat',`
<p>Solusi numerik adalah hampiran terhadap solusi eksak sehingga mengandung galat (ε), yaitu selisih solusi eksak <i>a</i> dan hampiran â.</p>
${F('Galat: ε = <i>a</i> − â<br>Galat mutlak: |ε| = |<i>a</i> − â|<br>Galat relatif: ε<sub>R</sub> = ε / <i>a</i> (atau × 100%)<br>Galat relatif hampiran: ε<sub>RA</sub> = ε / â')}
<h3>Contoh</h3>
<p>Nilai sejati = 10/3, hampiran = 3.333:</p>
<p>galat = 10/3 − 3333/1000 = 1/3000 = 0.000333…<br>galat mutlak = 0.000333…<br>galat relatif = (1/3000)/(10/3) = 1/10000 = 0.0001<br>galat relatif hampiran = (1/3000)/3.333 = 1/9999</p>
<h3>Kasus 2: pengurangan dua bilangan hampir sama</h3>
<p><i>f</i>(<i>x</i>) = √(<i>x</i>+<i>a</i>) − √<i>x</i>, <i>a</i> = 2, <i>x</i> = 10000, 6 angka bena.</p>
<p><b>(a) Langsung:</b> √10002 − √10000 = 100.010 − 100.000 = 0.0100000 (angka bena hilang).</p>
<p><b>(b) Kalikan akar sekawan:</b></p>
${F('<i>f</i>(<i>x</i>) = (√(<i>x</i>+<i>a</i>) − √<i>x</i>) × (√(<i>x</i>+<i>a</i>) + √<i>x</i>)/(√(<i>x</i>+<i>a</i>) + √<i>x</i>) = <i>a</i> / (√(<i>x</i>+<i>a</i>) + √<i>x</i>)')}
<p>= 2/(√10002 + √10000) = 0.009999500025 → 0.00999950</p>
<p><b>(c)</b> Eksak 0.00999950005. Galat (a) = 0.00000049995; galat (b) = 0.00000000005. Cara (b) jauh lebih teliti.</p>`],
['4. Metode Tertutup: Bagi Dua',`
<p>Syarat: akar ada di [<i>a</i>, <i>b</i>] dengan <i>f</i>(<i>a</i>)·<i>f</i>(<i>b</i>) &lt; 0. Bagi selang di tengah <i>c</i> = (<i>a</i>+<i>b</i>)/2.</p>
${F('Jika <i>f</i>(<i>a</i>)<i>f</i>(<i>c</i>) &lt; 0 → selang baru [<i>a</i>, <i>c</i>]; jika tidak → selang baru [<i>c</i>, <i>b</i>]')}
<h3>Kriteria berhenti</h3>
${F('Lebar selang: |<i>a</i> − <i>b</i>| &lt; ε<br>Nilai fungsi: |<i>f</i>(<i>c</i>)| &lt; μ<br>Galat relatif: |(<i>c</i><sub>baru</sub> − <i>c</i><sub>lama</sub>)/<i>c</i><sub>baru</sub>| &lt; δ')}
<h3>Kasus 3a: <i>f</i>(<i>x</i>) = <i>x</i><sup>3</sup> − 3<i>x</i> + 1, [1, 2], ε = 0.5</h3>
<div class="tw"><table><tr><th>r</th><th>a</th><th>c</th><th>b</th><th>f(a)</th><th>f(c)</th><th>f(b)</th><th>Selang baru</th><th>Lebar</th></tr>
<tr><td>0</td><td>1</td><td>1.5</td><td>2</td><td>−1</td><td>−0.125</td><td>3</td><td>[c, b]</td><td>0.5</td></tr>
<tr><td>1</td><td>1.5</td><td>1.75</td><td>2</td><td>−0.125</td><td>0.171875</td><td>3</td><td>[a, c]</td><td>0.25</td></tr></table></div>
<p>Berhenti di <i>r</i> = 1 karena lebar 0.25 &lt; 0.5. Hampiran akar <i>x</i> = 1.750000.</p>
<div class="note">Kelemahan bagi dua: konvergensinya lambat (contoh <i>e<sup>x</sup></i> − 5<i>x</i><sup>2</sup> di [0,1], ε = 0.00001, butuh 16 iterasi, akar 0.605263).</div>`],
['5. Metode Tertutup: Regula-Falsi',`
<p>Memanfaatkan nilai <i>f</i>(<i>a</i>) dan <i>f</i>(<i>b</i>): bila <i>f</i>(<i>a</i>) lebih dekat ke nol, akar lebih dekat ke <i>a</i>. Titik <i>c</i> didapat dari gradien garis AB = gradien garis BC:</p>
${F('(<i>f</i>(<i>b</i>) − <i>f</i>(<i>a</i>))/(<i>b</i> − <i>a</i>) = (<i>f</i>(<i>b</i>) − 0)/(<i>b</i> − <i>c</i>)  ⟹  <i>c</i> = <i>b</i> − <i>f</i>(<i>b</i>)(<i>b</i> − <i>a</i>) / (<i>f</i>(<i>b</i>) − <i>f</i>(<i>a</i>))')}
<h3>Kasus 3b: <i>x</i><sup>3</sup> − 3<i>x</i> + 1 di [1, 2], sampai <i>r</i> = 3</h3>
<div class="tw"><table><tr><th>r</th><th>a</th><th>c</th><th>b</th><th>f(a)</th><th>f(c)</th><th>f(b)</th><th>Selang</th><th>Lebar</th></tr>
<tr><td>0</td><td>1.000000</td><td>1.250000</td><td>2</td><td>−1.000000</td><td>−0.796875</td><td>3</td><td>[c, b]</td><td>0.750000</td></tr>
<tr><td>1</td><td>1.250000</td><td>1.407407</td><td>2</td><td>−0.796875</td><td>−0.434436</td><td>3</td><td>[c, b]</td><td>0.592593</td></tr>
<tr><td>2</td><td>1.407407</td><td>1.482367</td><td>2</td><td>−0.434436</td><td>−0.189731</td><td>3</td><td>[c, b]</td><td>0.517633</td></tr>
<tr><td>3</td><td>1.482367</td><td>1.511842</td><td>2</td><td>−0.189731</td><td>−0.082154</td><td>3</td><td>[c, b]</td><td>0.488158</td></tr></table></div>
<p>Hampiran akar pada iterasi ke-3: <i>x</i> = 1.511842.</p>
<div class="note">Ujung selang <i>b</i> tidak pernah berubah (selalu [c, b]); <i>c</i> menjadi titik mandek/stagnan.</div>`],
['6. Metode Terbuka: Iterasi Titik-Tetap',`
<p>Ubah <i>f</i>(<i>x</i>) = 0 menjadi <i>x</i> = <i>g</i>(<i>x</i>), lalu iterasi:</p>
${F('<i>x</i><sub><i>r</i>+1</sub> = <i>g</i>(<i>x</i><sub><i>r</i></sub>) ; <i>r</i> = 0, 1, 2, 3, …')}
<p>Berhenti bila |<i>x</i><sub><i>r</i>+1</sub> − <i>x</i><sub><i>r</i></sub>| &lt; ε atau |(<i>x</i><sub><i>r</i>+1</sub> − <i>x</i><sub><i>r</i></sub>)/<i>x</i><sub><i>r</i>+1</sub>| &lt; δ.</p>
<h3>Contoh: <i>x</i><sub><i>r</i>+1</sub> = √(2<i>x</i><sub><i>r</i></sub> + 3), <i>x</i><sub>0</sub> = 4</h3>
<p><i>x</i><sub>1</sub> = √(2(4)+3) = √11 ≈ 3.316625; lalu 3.103748; 3.034385; 3.011440; … menuju <i>x</i> = 3.000000 (konvergen monoton).</p>`],
['7. Metode Newton-Raphson',`
<p>Paling terkenal dan paling cepat konvergen. Rumus diturunkan (i) secara geometri atau (ii) dengan deret Taylor.</p>
<h3>Penurunan geometri</h3>
<p>Gradien garis singgung di <i>x</i><sub><i>r</i></sub>:</p>
${F('<i>m</i> = <i>f</i>′(<i>x</i><sub><i>r</i></sub>) = Δ<i>y</i>/Δ<i>x</i> = (<i>f</i>(<i>x</i><sub><i>r</i></sub>) − 0)/(<i>x</i><sub><i>r</i></sub> − <i>x</i><sub><i>r</i>+1</sub>)')}
<p>Susun ulang:</p>
${F('<i>x</i><sub><i>r</i>+1</sub> = <i>x</i><sub><i>r</i></sub> − <i>f</i>(<i>x</i><sub><i>r</i></sub>) / <i>f</i>′(<i>x</i><sub><i>r</i></sub>) , <i>f</i>′(<i>x</i><sub><i>r</i></sub>) ≠ 0')}
<h3>Contoh: <i>f</i>(<i>x</i>) = <i>e<sup>x</sup></i> − 5<i>x</i><sup>2</sup>, <i>x</i><sub>0</sub> = 0.5</h3>
<p><i>f</i>′(<i>x</i>) = <i>e<sup>x</sup></i> − 10<i>x</i>. Iterasi: 0.500000 → 0.618976 → 0.605444 → 0.605267 → 0.605267. Akar <i>x</i> = 0.605267.</p>
<h3>Kasus 4: <i>f</i>(<i>x</i>) = <i>x</i><sup>3</sup> − <i>x</i> − 1, <i>x</i><sub>0</sub> = 1</h3>
<p><i>f</i>′(<i>x</i>) = 3<i>x</i><sup>2</sup> − 1. Hasil: <i>x</i><sub>1</sub> = 1.500000, <i>x</i><sub>2</sub> = 1.347826, <i>x</i><sub>3</sub> = 1.325200.</p>
<p><b>Coba sendiri</b> (klik berulang):</p>
<button class="btn" id="nb">Iterasi berikutnya</button><button class="btn s" id="nr">Reset</button>
<div class="tw"><table id="nt"></table></div>`]
];
$('#materi').innerHTML=M.map((m,i)=>`<details class="card" ${i==0?'open':''}><summary>${m[0]}</summary>${m[1]}</details>`).join('');

<script>
(()=>{
if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const mk=(c,x,y)=>{const e=document.createElement('span');e.className='fx '+c;e.style.transform='translate('+x+'px,'+y+'px)';document.body.appendChild(e);return e};
addEventListener('pointerdown',ev=>{
const x=ev.clientX,y=ev.clientY;
const r=mk('ring',x,y);r.animate([{transform:'translate('+x+'px,'+y+'px) scale(.2)',opacity:.9},{transform:'translate('+x+'px,'+y+'px) scale(1.6)',opacity:0}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>r.remove();
const n=ev.pointerType==='mouse'?8:7;
for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.5,d=26+Math.random()*26,p=mk('sq'+(i%2?' d':''),x,y);
p.animate([{transform:'translate('+x+'px,'+y+'px) scale(1) rotate(0)',opacity:1},{transform:'translate('+(x+Math.cos(a)*d)+'px,'+(y+Math.sin(a)*d+10)+'px) scale(.2) rotate('+(Math.random()*180)+'deg)',opacity:0}],{duration:520+Math.random()*200,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>p.remove()}
},{passive:true});
})();
</script>
